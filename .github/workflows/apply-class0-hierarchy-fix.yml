name: Apply class0 hierarchy fix

on:
  push:
    branches: [agent/full-extraction-pipeline-v1]
    paths: [.github/workflows/apply-class0-hierarchy-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run class-0 hierarchy fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-extraction-pipeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply class-0 hierarchy correction
        run: python scripts/_apply_class0_hierarchy_fix.py
      - name: Verify Python and regression suite
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit correction and remove staging helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-class0-hierarchy-fix.yml scripts/_apply_class0_hierarchy_fix.py
          git add scripts/bz2_hrc_tree_probe.py tests/test_hrc_tree_probe.py
          git commit -m 'Exclude non-model class-0 helper records from HRC hierarchy'
          git push origin HEAD:agent/full-extraction-pipeline-v1
