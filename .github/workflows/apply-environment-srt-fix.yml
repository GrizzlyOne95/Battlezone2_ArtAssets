name: Apply environment SRT fix

on:
  push:
    branches: [agent/full-extraction-pipeline-v1]
    paths: [.github/workflows/apply-environment-srt-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run DSC environment SRT fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-extraction-pipeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply archive-backed SRT grammar correction
        run: python scripts/_apply_environment_srt_fix.py
      - name: Verify Python and regression suite
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit correction and remove staging helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-environment-srt-fix.yml scripts/_apply_environment_srt_fix.py
          git add scripts/bz2_dsc_multiroot_gltf.py tests/test_multiroot_hierarchy.py
          git commit -m 'Accept DSC root SRT without MPRFLG'
          git push origin HEAD:agent/full-extraction-pipeline-v1
