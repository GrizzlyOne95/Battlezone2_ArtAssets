name: Promote code401 CurrentUV matrix effects
on:
  push:
    branches: [agent/full-extraction-pipeline-v1]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-extraction-pipeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch current source
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/bz2_projection_uv.py')
          s=p.read_text()
          anchor='''def projection_type_name(code: int | None) -> str | None:\n'''
          helper='''def apply_current_uv_effects(uvw, projection: dict):\n    """Apply corpus-proven live SI_Texture2D effects to an authored CurrentUV.\n\n    Softimage Texture.GetTransformValues starts from Material.CurrentUV and applies\n    projection-definition transformation plus texture/image effects. BZ2 HRC stores\n    only U/V, so the preserved polygon source is promoted to (U,V,0). The supplied\n    code-401 corpus has rotation-only matrix state: unit matrix scale and zero matrix\n    translation. Source UV data is never overwritten; callers create derived UVs.\n    """\n    u, v = float(uvw[0]), float(uvw[1])\n    w = float(uvw[2]) if len(uvw) >= 3 else 0.0\n    rotation = projection.get("si_texture2d_matrix_rotation_xyz_radians") or [0.0, 0.0, 0.0]\n    if not all(abs(float(value)) <= MATRIX_IDENTITY_TOLERANCE for value in rotation):\n        if not projection_rotation_supported(projection):\n            raise ValueError("non-identity CurrentUV matrix scale/translation is not corpus-proven")\n        u, v, w = _mul3(_rotation_matrix_xyz(rotation), (u, v, w))\n    result = apply_uv_repeats((u, v), projection.get("si_texture2d_repeat_uv"))\n    result = apply_uv_scale_offset(\n        result,\n        projection.get("si_texture2d_uv_scale"),\n        projection.get("si_texture2d_uv_offset"),\n    )\n    image_size = (\n        [projection.get("width"), projection.get("height")]\n        if projection.get("width") and projection.get("height")\n        else None\n    )\n    result = apply_crop(result, projection.get("crop_rect_pixels_raw"), image_size)\n    return result[0], result[1], w\n\n\n'''
          if 'def apply_current_uv_effects' not in s:
              s=s.replace(anchor,helper+anchor)
          p.write_text(s)

          p=Path('scripts/blender_apply_bz2_asset_uvs.py')
          s=p.read_text()
          anchor='''def _find_texture_node(material, texture_object: str):\n'''
          helper='''def _derive_current_uv_effect_map(obj, layer: dict, uv_name: str) -> dict:\n    """Create a derived effective UV layer while preserving imported CurrentUV."""\n    mesh = obj.data\n    source = mesh.uv_layers.active or (mesh.uv_layers[0] if mesh.uv_layers else None)\n    if source is None:\n        raise ValueError("no source UV layer available")\n    target = mesh.uv_layers.get(uv_name)\n    if target is None:\n        target = mesh.uv_layers.new(name=uv_name)\n    if len(source.data) != len(target.data):\n        raise ValueError("source/derived UV loop counts differ")\n    for index, source_loop in enumerate(source.data):\n        u, v, _w = projection_uv.apply_current_uv_effects(\n            (float(source_loop.uv.x), float(source_loop.uv.y), 0.0), layer\n        )\n        target.data[index].uv = (u, v)\n    return {\n        "uv_map": target.name,\n        "source_uv_map": source.name,\n        "loop_count": len(target.data),\n        "status": "derived_from_preserved_currentuv_with_live_txmp_effects",\n    }\n\n\n'''
          if 'def _derive_current_uv_effect_map' not in s:
              s=s.replace(anchor,helper+anchor)

          old='''                if source_uv_usable:\n                    # Archive qualification: 6,230 mapped class-4 code401 models\n                    # carry nonzero authored HRC UVs, and regenerating them from\n                    # fitted geometry diverges materially for most source assets.\n                    # Preserve CurrentUV and layer only proven live image effects.\n                    _link_source_uv_transform(material, tex_node, layer, texture_object)\n                    source_uv_fallbacks += 1\n                    if not projection_uv.matrix_srt_is_identity(layer):\n                        deferred.append({\n                            "object": obj.name,\n                            "texture": texture_object,\n                            "reason": "nonidentity_code401_live_uvw_transform",\n                            "fallback": "authored_source_uv_plus_confirmed_repeat_image_transform",\n                        })\n'''
          new='''                if source_uv_usable:\n                    # Preserve authored HRC CurrentUV. Build a separate effective UV\n                    # layer with the recovered live TXMP transformation/effects.\n                    uv_name = _safe_name(f"EFFECT_{texture_object}", "BZ2")\n                    try:\n                        uv_result = _derive_current_uv_effect_map(obj, layer, uv_name)\n                        _link_uv_map(material, tex_node, uv_result["uv_map"], f"Effective {texture_object}")\n                        material_rewired += 1\n                        source_uv_fallbacks += 1\n                    except Exception as exc:\n                        _link_source_uv_transform(material, tex_node, layer, texture_object)\n                        source_uv_fallbacks += 1\n                        deferred.append({\n                            "object": obj.name,\n                            "texture": texture_object,\n                            "reason": f"currentuv_effect_error:{type(exc).__name__}:{exc}",\n                            "fallback": "authored_source_uv_plus_confirmed_repeat_image_transform",\n                        })\n'''
          if old not in s:
              raise SystemExit('source CurrentUV branch anchor not found')
          s=s.replace(old,new)
          s=s.replace(
              'Model-local DSC relation-code-400 projection records are particularly safe for\nthis stage: the validated archival corpus contains 403 resolved edges, all using\nworking projection codes 1..5 and all with identity +90 texture-matrix SRT.',
              'Model-local relation-code-400 projections and material-level code-401 CurrentUV\npaths are handled separately. Authored nonzero HRC UVs are preserved; a derived\neffective UV layer receives corpus-proven TXMP rotation/repeat/+6/crop effects.'
          )
          p.write_text(s)

          Path('tests/test_code401_currentuv_effects.py').write_text('''from __future__ import annotations\nimport math\nimport sys\nimport unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nsys.path.insert(0,str(ROOT/'scripts'))\nimport bz2_projection_uv as uv\n\nclass Code401CurrentUVEffectsTests(unittest.TestCase):\n    def test_stasis_pi_y_mirrors_u_without_mutating_input(self):\n        p={\n            "relation_code":401,\n            "si_texture2d_matrix_rotation_xyz_radians":[0.0,math.pi,0.0],\n            "si_texture2d_matrix_scale_xyz":[1,1,1],\n            "si_texture2d_matrix_translation_xyz":[0,0,0],\n            "si_texture2d_repeat_uv":[1,1],\n            "si_texture2d_uv_scale":[1,1],\n            "si_texture2d_uv_offset":[0,0],\n        }\n        source=(0.25,0.75,0.0)\n        out=uv.apply_current_uv_effects(source,p)\n        self.assertAlmostEqual(out[0],-0.25,places=6)\n        self.assertAlmostEqual(out[1],0.75,places=6)\n        self.assertEqual(source,(0.25,0.75,0.0))\n\n    def test_rotation_then_repeat_scale_offset(self):\n        p={\n            "relation_code":401,\n            "si_texture2d_matrix_rotation_xyz_radians":[0,0,math.pi/2],\n            "si_texture2d_matrix_scale_xyz":[1,1,1],\n            "si_texture2d_matrix_translation_xyz":[0,0,0],\n            "si_texture2d_repeat_uv":[2,3],\n            "si_texture2d_uv_scale":[0.5,2],\n            "si_texture2d_uv_offset":[0.1,-0.2],\n        }\n        u,v,w=uv.apply_current_uv_effects((1,0,0),p)\n        self.assertAlmostEqual(u,0.1,places=6)\n        self.assertAlmostEqual(v,5.8,places=6)\n        self.assertAlmostEqual(w,0,places=6)\n\n    def test_unobserved_matrix_scale_is_rejected(self):\n        p={\n            "relation_code":401,\n            "si_texture2d_matrix_rotation_xyz_radians":[0,0.5,0],\n            "si_texture2d_matrix_scale_xyz":[1.1,1,1],\n            "si_texture2d_matrix_translation_xyz":[0,0,0],\n        }\n        with self.assertRaises(ValueError):\n            uv.apply_current_uv_effects((0.2,0.3,0),p)\n\nif __name__=='__main__': unittest.main()\n''')
          PY
      - name: Test
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/bz2_projection_uv.py
      - name: Commit tested patch and remove workflow
        run: |
          rm .github/workflows/promote-code401-currentuv-matrix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/bz2_projection_uv.py scripts/blender_apply_bz2_asset_uvs.py tests/test_code401_currentuv_effects.py .github/workflows/promote-code401-currentuv-matrix.yml
          git commit -m 'Apply live TXMP effects to preserved code-401 CurrentUV'
          git push origin HEAD:agent/full-extraction-pipeline-v1
