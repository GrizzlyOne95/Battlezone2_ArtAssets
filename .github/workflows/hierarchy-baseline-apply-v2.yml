name: Run DSC hierarchy patch v2

on:
  push:
    branches: [agent/full-extraction-pipeline-v1]
    paths: [.github/workflows/hierarchy-baseline-apply-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run DSC hierarchy patch v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-extraction-pipeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply staged patch
        run: python scripts/_apply_hierarchy_patch.py
      - name: Verify patch
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit patch and remove staging helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hierarchy-baseline-patch.yml .github/workflows/hierarchy-baseline-apply-v2.yml scripts/_apply_hierarchy_patch.py
          git add scripts/bz2_hrc_gltf.py scripts/bz2_hrc_gltf_parametric.py scripts/bz2_dsc_multiroot_gltf.py tests/test_multiroot_hierarchy.py
          git commit -m 'Use DSC hierarchy to disambiguate HRC baselines'
          git push origin HEAD:agent/full-extraction-pipeline-v1
