name: Pipeline tests

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: python -m compileall -q scripts tests
      - name: Run source-independent tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Upload pipeline runtime bundle
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-runtime
          path: |
            scripts/
            tests/
          if-no-files-found: error
          retention-days: 1
