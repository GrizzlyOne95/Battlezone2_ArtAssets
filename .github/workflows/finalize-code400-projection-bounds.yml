name: Finalize code400 fitted support bounds
on:
  push:
    branches: [agent/full-extraction-pipeline-v1]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-extraction-pipeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch current source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/bz2_projection_uv.py')
          s=p.read_text()
          old='''The supplied archival relation-code-400 corpus contains 403 resolved edges and\nall of their +90 texture-matrix SRT blocks are identity. Non-identity matrix\nstate is therefore rejected here rather than guessed. Material-level code-401\nlayers can preserve such matrix state separately until that direction is proven.\n'''
          new='''The full supplied primary corpus contains 283 relation-code-400 edges, including\n54 non-identity +90 matrix SRTs. Archive/source validation proves that the stored\nrotation is a Softimage projection-support pose: for rotation-only model-local\ncode-400 polygon bindings, object coordinates are transformed by the inverse\nsiXYZ support rotation before projection. Non-unit support scale/translation and\nmaterial-level code-401 matrix application remain separate evidence boundaries.\n'''
          if old in s:
              s=s.replace(old,new)

          anchor='''def projection_type_name(code: int | None) -> str | None:\n'''
          helper='''def prepare_projection_points(points, projection: dict):\n    """Prepare a whole fitted support once, returning support-local points/bounds.\n\n    PATCH: rotating an object's pre-rotation AABB and then bounding its corners\n    overestimates the fitted support for irregular meshes. Corpus validation on\n    all 21 non-identity class-4 code-400 edges found base-UV deltas up to 0.319.\n    Transform the actual mesh vertices first, then derive the projection bounds.\n    """\n    values = [tuple(float(component) for component in point[:3]) for point in points]\n    if not values:\n        raise ValueError("cannot prepare projection support from zero points")\n    if matrix_srt_is_identity(projection):\n        return values, bounds_from_points(values)\n    if not code400_rotation_supported(projection):\n        raise ValueError("non-identity SI_Texture2D matrix is not proven for this binding path")\n    transformed = [projection_space_point(point, projection) for point in values]\n    return transformed, bounds_from_points(transformed)\n\ndef project_prepared_polygon(points, bounds, projection: dict):\n    """Project points already expressed in projection-support local coordinates."""\n    code = int(projection.get("projection_or_mapping_code_candidate") or 0)\n    if code not in WORKING_PROJECTION_TYPES:\n        raise ValueError(f"unsupported working projection code {code}")\n    uvs = [base_projection_uv(point, bounds, code) for point in points]\n    if code in {4, 5}:\n        uvs = unwrap_angular_seam(uvs)\n    repeats = projection.get("si_texture2d_repeat_uv")\n    scale = projection.get("si_texture2d_uv_scale")\n    offset = projection.get("si_texture2d_uv_offset")\n    crop = projection.get("crop_rect_pixels_raw")\n    image_size = (\n        [projection.get("width"), projection.get("height")]\n        if projection.get("width") and projection.get("height")\n        else None\n    )\n    return [\n        apply_crop(\n            apply_uv_scale_offset(apply_uv_repeats(uv, repeats), scale, offset),\n            crop,\n            image_size,\n        )\n        for uv in uvs\n    ]\n\n\n'''
          if 'def prepare_projection_points' not in s:
              s=s.replace(anchor,helper+anchor)

          start=s.index('def project_polygon(points:')
          end=s.index('\n\ndef self_test()',start)
          replacement='''def project_polygon(points: Sequence[Sequence[float]], bounds, projection: dict) -> list[tuple[float, float]]:\n    """Compatibility projection API for one polygon.\n\n    Blender's production path uses ``prepare_projection_points`` on the complete\n    mesh and ``project_prepared_polygon`` so fitted bounds are exact. This helper\n    retains the older bounds argument for standalone callers.\n    """\n    code = int(projection.get("projection_or_mapping_code_candidate") or 0)\n    if code not in WORKING_PROJECTION_TYPES:\n        raise ValueError(f"unsupported working projection code {code}")\n    if not matrix_srt_is_identity(projection):\n        if not code400_rotation_supported(projection):\n            raise ValueError("non-identity SI_Texture2D matrix SRT is not promoted for this binding path")\n        bounds = projection_space_bounds(bounds, projection)\n        points = [projection_space_point(point, projection) for point in points]\n    return project_prepared_polygon(points, bounds, projection)\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path('scripts/blender_apply_bz2_asset_uvs.py')
          s=p.read_text()
          old='''    bounds = _bounds(mesh)\n    assigned = 0\n    for polygon in mesh.polygons:\n        loop_indices = list(polygon.loop_indices)\n        points = [mesh.vertices[mesh.loops[index].vertex_index].co for index in loop_indices]\n        uvs = projection_uv.project_polygon(points, bounds, projection)\n'''
          new='''    prepared_points, bounds = projection_uv.prepare_projection_points(\n        [tuple(vertex.co) for vertex in mesh.vertices], projection\n    )\n    assigned = 0\n    for polygon in mesh.polygons:\n        loop_indices = list(polygon.loop_indices)\n        points = [prepared_points[mesh.loops[index].vertex_index] for index in loop_indices]\n        uvs = projection_uv.project_prepared_polygon(points, bounds, projection)\n'''
          if old not in s and new not in s:
              raise SystemExit('Blender projection preparation anchor not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('tests/test_code400_projection_transform.py')
          s=p.read_text()
          needle='''    def test_nonidentity_code401_remains_deferred(self):\n'''
          test='''    def test_prepared_support_bounds_use_actual_transformed_mesh(self):\n        p={\n            "relation_code":400,\n            "projection_or_mapping_code_candidate":2,\n            "si_texture2d_matrix_rotation_xyz_radians":[0.0,0.0,0.7],\n            "si_texture2d_matrix_scale_xyz":[1,1,1],\n            "si_texture2d_matrix_translation_xyz":[0,0,0],\n        }\n        points=[(0,0,0),(4,0,0),(0,1,0)]\n        prepared,bounds=uv.prepare_projection_points(points,p)\n        self.assertEqual(len(prepared),3)\n        self.assertEqual(bounds,uv.bounds_from_points(prepared))\n        original=uv.bounds_from_points(points)\n        rotated_aabb=uv.projection_space_bounds(original,p)\n        self.assertNotEqual(bounds,rotated_aabb)\n\n'''
          if 'test_prepared_support_bounds_use_actual_transformed_mesh' not in s:
              s=s.replace(needle,test+needle)
          p.write_text(s)
          PY
      - name: Test
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/bz2_projection_uv.py
      - name: Commit tested fix and remove workflow
        run: |
          rm .github/workflows/finalize-code400-projection-bounds.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/bz2_projection_uv.py scripts/blender_apply_bz2_asset_uvs.py tests/test_code400_projection_transform.py .github/workflows/finalize-code400-projection-bounds.yml
          git commit -m 'Use transformed mesh bounds for code-400 projections'
          git push origin HEAD:agent/full-extraction-pipeline-v1
