name: Correct code400 transform direction
on:
  push:
    branches: [agent/full-extraction-pipeline-v1]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-extraction-pipeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Correct transform direction and regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/bz2_projection_uv.py')
          s=p.read_text()
          s=s.replace(
              'object coordinates are transformed by the inverse\nsiXYZ support rotation before projection.',
              'object coordinates are transformed by the serialized\nsiXYZ object-to-projection rotation before projection.'
          )
          s=s.replace(
              '# The stored matrix is the projection-support pose. Inverse rotation moves\n    # model coordinates into support-local UVW space; inverse(rotation)=transpose.\n    return _mul3(_transpose3(_rotation_matrix_xyz(rotation)), point)',
              '# The serialized rotation maps object coordinates into projection-local UVW.\n    # face39 validates this direction geometrically: R*n becomes almost pure +Y\n    # for a planar-XZ projection; transposing R produces the wrong support axis.\n    return _mul3(_rotation_matrix_xyz(rotation), point)'
          )
          p.write_text(s)

          p=Path('tests/test_code400_projection_transform.py')
          s=p.read_text()
          start=s.index('    def test_inverse_support_rotation_matches_face39_axis(self):')
          end=s.index('\n    def ',start+5)
          replacement='''    def test_serialized_rotation_maps_face39_normal_to_planar_axis(self):\n        p={\n            "relation_code":400,\n            "projection_or_mapping_code_candidate":2,\n            "si_texture2d_matrix_rotation_xyz_radians":[-0.5000020265579224,0.0,-0.6780027747154236],\n            "si_texture2d_matrix_scale_xyz":[1,1,1],\n            "si_texture2d_matrix_translation_xyz":[0,0,0],\n        }\n        normal=(-0.7183021974407146,0.6008504122768953,0.350743118561898)\n        projected=uv.projection_space_point(normal,p)\n        self.assertGreater(abs(projected[1]),0.99)\n        self.assertLess(abs(projected[0]),0.13)\n        self.assertLess(abs(projected[2]),0.03)\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Test
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/bz2_projection_uv.py
      - name: Commit corrected transform and remove workflow
        run: |
          rm .github/workflows/correct-code400-transform-direction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/bz2_projection_uv.py tests/test_code400_projection_transform.py .github/workflows/correct-code400-transform-direction.yml
          git commit -m 'Correct Softimage code-400 transform direction'
          git push origin HEAD:agent/full-extraction-pipeline-v1
