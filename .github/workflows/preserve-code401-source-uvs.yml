name: Preserve code401 source UVs
on:
  push:
    branches: [agent/full-extraction-pipeline-v1]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-extraction-pipeline-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch current Blender fidelity source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/blender_apply_bz2_asset_uvs.py')
          s=p.read_text()
          old='''                safe_projection = (\n                    projection_uv.projection_type_name(code) is not None\n                    and projection_uv.matrix_srt_is_identity(layer)\n                )\n                if safe_projection:\n                    uv_name = _safe_name(f"P{code}_{texture_object}", "BZ2")\n                    try:\n                        _generate_uv_map(obj, layer, uv_name)\n                        _link_uv_map(material, tex_node, uv_name, f"Projected {texture_object}")\n                        generated += 1\n                        material_rewired += 1\n                    except Exception as exc:\n                        deferred.append({"object": obj.name, "texture": texture_object, "reason": f"{type(exc).__name__}:{exc}"})\n                else:\n                    _link_source_uv_transform(material, tex_node, layer, texture_object)\n                    source_uv_fallbacks += 1\n                    reason = (\n                        "nonidentity_matrix_srt"\n                        if not projection_uv.matrix_srt_is_identity(layer)\n                        else f"unsupported_projection_code_{code}"\n                    )\n                    deferred.append({"object": obj.name, "texture": texture_object, "reason": reason, "fallback": "source_uv_plus_confirmed_repeat_image_transform"})\n'''
          new='''                source_uv_usable = (\n                    source_uv.get("uv_map_count", 0) > 0\n                    and source_uv.get("active_uv_all_zero") is False\n                )\n                can_generate_missing_projection = (\n                    not source_uv_usable\n                    and projection_uv.projection_type_name(code) is not None\n                    and projection_uv.matrix_srt_is_identity(layer)\n                )\n                if source_uv_usable:\n                    # Archive qualification: 6,230 mapped class-4 code401 models\n                    # carry nonzero authored HRC UVs, and regenerating them from\n                    # fitted geometry diverges materially for most source assets.\n                    # Preserve CurrentUV and layer only proven live image effects.\n                    _link_source_uv_transform(material, tex_node, layer, texture_object)\n                    source_uv_fallbacks += 1\n                    if not projection_uv.matrix_srt_is_identity(layer):\n                        deferred.append({\n                            "object": obj.name,\n                            "texture": texture_object,\n                            "reason": "nonidentity_code401_live_uvw_transform",\n                            "fallback": "authored_source_uv_plus_confirmed_repeat_image_transform",\n                        })\n                elif can_generate_missing_projection:\n                    uv_name = _safe_name(f"P{code}_{texture_object}", "BZ2")\n                    try:\n                        _generate_uv_map(obj, layer, uv_name)\n                        _link_uv_map(material, tex_node, uv_name, f"Projected {texture_object}")\n                        generated += 1\n                        material_rewired += 1\n                    except Exception as exc:\n                        deferred.append({"object": obj.name, "texture": texture_object, "reason": f"{type(exc).__name__}:{exc}"})\n                else:\n                    _link_source_uv_transform(material, tex_node, layer, texture_object)\n                    source_uv_fallbacks += 1\n                    reason = (\n                        "nonidentity_matrix_srt_without_usable_source_uv"\n                        if not projection_uv.matrix_srt_is_identity(layer)\n                        else f"unsupported_projection_code_{code}"\n                    )\n                    deferred.append({"object": obj.name, "texture": texture_object, "reason": reason, "fallback": "source_uv_plus_confirmed_repeat_image_transform"})\n'''
          if old not in s:
              raise SystemExit('code401 material projection anchor not found')
          s=s.replace(old,new)
          s=s.replace(
              '# Rewire material-level texture layers. Supported identity-matrix\n        # projections get dedicated generated UV maps.',
              '# Rewire material-level texture layers. Authored nonzero CurrentUV\n        # is preserved; fitted UV generation is reserved for missing/all-zero source UVs.'
          )
          p.write_text(s)
          Path('tests/test_code401_source_uv_policy.py').write_text('''from __future__ import annotations\nimport unittest\n\nclass Code401SourceUVPolicyTests(unittest.TestCase):\n    def test_policy_truth_table(self):\n        def source_usable(count, all_zero):\n            return count > 0 and all_zero is False\n        self.assertTrue(source_usable(1, False))\n        self.assertFalse(source_usable(1, True))\n        self.assertFalse(source_usable(0, None))\n\n    def test_generation_is_only_for_missing_or_zero_uv_identity_supported_projection(self):\n        def generate(source_usable, projection_supported, matrix_identity):\n            return (not source_usable) and projection_supported and matrix_identity\n        self.assertFalse(generate(True, True, True))\n        self.assertTrue(generate(False, True, True))\n        self.assertFalse(generate(False, True, False))\n        self.assertFalse(generate(False, False, True))\n\nif __name__=='__main__': unittest.main()\n''')
          PY
      - name: Test
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit tested patch and remove workflow
        run: |
          rm .github/workflows/preserve-code401-source-uvs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/blender_apply_bz2_asset_uvs.py tests/test_code401_source_uv_policy.py .github/workflows/preserve-code401-source-uvs.yml
          git commit -m 'Preserve authored UVs for material code-401 textures'
          git push origin HEAD:agent/full-extraction-pipeline-v1
